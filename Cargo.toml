[package]
name = "saeed-desktop"
version = "0.1.1"
edition = "2024"
description = "Saeed AI desktop companion"

[dependencies]
slint = "1.17"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json", "multipart"] }
cpal = "0.16"
hound = "3.5"
rodio = "0.22"
keyring = "4.2"

[build-dependencies]
slint-build = "1.17"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
