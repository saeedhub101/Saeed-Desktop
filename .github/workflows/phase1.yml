name: Phase 1 — Build and Full Windows Runtime Acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  phase1:
    name: Windows Phase 1 acceptance
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install frontend dependencies
        shell: pwsh
        run: npm install
      - name: Generate icons
        shell: pwsh
        run: npm run icons
      - name: TypeScript check
        shell: pwsh
        run: npm run check
      - name: Cargo check
        shell: pwsh
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Cargo clippy
        shell: pwsh
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets
      - name: Build NSIS installer
        shell: pwsh
        run: npm run build
      - name: Verify Phase 1 packaging contract
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($config.bundle.targets -notcontains "nsis") { throw "NSIS target is missing" }
          if ($config.bundle.windows.webviewInstallMode.type -ne "embedBootstrapper") { throw "WebView2 bootstrapper is not embedded" }
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw "No NSIS installer was produced" }
          $installer.FullName | Out-File "$env:RUNNER_TEMP\installer.txt" -Encoding utf8
      - name: Run complete Phase 1 core installed-EXE smoke
        continue-on-error: true
        shell: pwsh
        run: |
          $installer = (Get-Content "$env:RUNNER_TEMP\installer.txt" -Raw).Trim()
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/phase1-smoke.ps1 -Installer $installer
      - name: Run independent Tray smoke — Win32 mouse
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $installer = (Get-Content "$env:RUNNER_TEMP\installer.txt" -Raw).Trim()
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/phase1-tray-smoke.ps1 -Installer $installer
      - name: Run independent Tray smoke — UI Automation
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $installer = (Get-Content "$env:RUNNER_TEMP\installer.txt" -Raw).Trim()
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/phase1-tray-uia-smoke.ps1 -Installer $installer
      - name: Run independent Tray smoke — keyboard input
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $installer = (Get-Content "$env:RUNNER_TEMP\installer.txt" -Raw).Trim()
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/phase1-tray-keyboard-smoke.ps1 -Installer $installer
      - name: Enforce all smoke results and print detailed report
        if: always()
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/phase1-smoke-gate.ps1
      - name: Collect Phase 1 evidence
        if: always()
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "phase1-evidence"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          @("phase1-results.json","phase1-tray-results.json","phase1-tray-uia-results.json","phase1-tray-keyboard-results.json","phase1-full-report.json","phase1-full-report.txt","installer.txt") | ForEach-Object {
            $p=Join-Path $env:RUNNER_TEMP $_
            if(Test-Path $p){Copy-Item $p $evidence -Force}
          }
      - name: Publish Phase 1 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase1-evidence
          path: ${{ runner.temp }}/phase1-evidence/**
          if-no-files-found: warn

      - name: Publish installer
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: Saeed-Phase1-NSIS
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
