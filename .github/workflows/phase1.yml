name: Phase 1 — Build and Full Windows Runtime Acceptance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase1:
    name: Windows Phase 1 acceptance
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        shell: pwsh
        run: npm install

      - name: Generate icons
        shell: pwsh
        run: npm run icons

      - name: Verify generated icon set
        shell: pwsh
        run: |
          $required = @(
            "src-tauri/icons/32x32.png",
            "src-tauri/icons/128x128.png",
            "src-tauri/icons/128x128@2x.png",
            "src-tauri/icons/icon.png",
            "src-tauri/icons/icon.ico"
          )
          foreach ($path in $required) {
            if (!(Test-Path $path)) { throw "Missing generated icon: $path" }
          }

      - name: TypeScript check
        shell: pwsh
        run: npm run check

      - name: Rust format check
        shell: pwsh
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Cargo check
        shell: pwsh
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Cargo clippy
        shell: pwsh
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Build NSIS installer
        shell: pwsh
        run: npm run build

      - name: Verify Phase 1 packaging contract
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($config.bundle.targets -notcontains "nsis") { throw "NSIS target is missing" }
          if ($config.bundle.windows.webviewInstallMode.type -ne "embedBootstrapper") { throw "WebView2 bootstrapper is not embedded" }
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw "No NSIS installer was produced" }
          "INSTALLER=$($installer.FullName)" | Out-File "$env:RUNNER_TEMP\installer.txt" -Encoding utf8
          Write-Host "Installer: $($installer.FullName)"

      - name: Run complete Phase 1 installed-EXE smoke
        shell: pwsh
        run: |
          $installer = (Get-Content "$env:RUNNER_TEMP\installer.txt" -Raw).Trim()
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/phase1-smoke.ps1 -Installer $installer

      - name: Collect Phase 1 evidence
        if: always()
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "phase1-evidence"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $results = Join-Path $env:RUNNER_TEMP "phase1-results.json"
          if (Test-Path $results) { Copy-Item $results $evidence -Force }
          if (Test-Path "$env:RUNNER_TEMP\installer.txt") { Copy-Item "$env:RUNNER_TEMP\installer.txt" $evidence -Force }
          $logs = "$env:APPDATA\Saeed\logs"
          if (Test-Path $logs) { Copy-Item "$logs\*.log" $evidence -Force -ErrorAction SilentlyContinue }

      - name: Publish Phase 1 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase1-evidence
          path: ${{ runner.temp }}/phase1-evidence/**
          if-no-files-found: warn

      - name: Publish installer
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: Saeed-Phase1-NSIS
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
