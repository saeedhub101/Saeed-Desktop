name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: saeed-desktop-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check
        run: cargo check

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Package prototype
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/saeed-desktop.exe dist/Saeed.exe
          Compress-Archive -Path dist/Saeed.exe -DestinationPath Saeed-Desktop-Prototype.zip

      - name: Upload prototype
        uses: actions/upload-artifact@v4
        with:
          name: Saeed-Desktop-Prototype
          path: Saeed-Desktop-Prototype.zip
