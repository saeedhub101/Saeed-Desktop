name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: saeed-desktop-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check
        run: cargo check

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Runtime smoke test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "target/release/saeed-desktop.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "Saeed exited during startup smoke test with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force
          Write-Host "Saeed startup smoke test passed."

      - name: Package Saeed
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/saeed-desktop.exe dist/Saeed.exe
          New-Item -ItemType Directory -Force -Path dist/assets | Out-Null
          Copy-Item assets/Saeed_AI-3D.glb dist/assets/Saeed_AI-3D.glb
          Compress-Archive -Path dist/Saeed.exe,dist/assets -DestinationPath Saeed-Desktop.zip

      - name: Upload prototype
        uses: actions/upload-artifact@v4
        with:
          name: Saeed-Desktop
          path: Saeed-Desktop.zip
