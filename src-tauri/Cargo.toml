[package]
name = "saeed"
version = "0.1.0"
description = "Saeed lightweight Windows desktop AI agent shell"
authors = ["Saeed O. Almansour"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.8.0", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15.4"

tauri-plugin-single-instance = "2.3.6"
