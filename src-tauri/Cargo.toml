[package]
name = "saeed"
version = "0.1.0"
description = "Saeed lightweight Windows desktop AI agent shell"
authors = ["Saeed O. Almansour"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15.4"
tauri-plugin-single-instance = "=2.4.5"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
